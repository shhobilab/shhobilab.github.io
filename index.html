<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHHOBİ LAB - Günün Mesajı</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 40px 20px; }
        .logo { max-width: 150px; margin-bottom: 20px; }
        .card { border: 2px solid #39ff14; border-radius: 15px; padding: 25px; box-shadow: 0 0 15px rgba(57,255,20,0.3); background: #1a1a1a; }
        .message { font-size: 1.2rem; color: #39ff14; font-weight: bold; line-height: 1.5; }
        .btn { margin-top: 25px; padding: 10px 20px; background: #39ff14; color: #000; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>✨ Günün Sürpriz Mesajı ✨</h2>
        <p id="msg" class="message"></p>
        <button class="btn" onclick="yeniMesaj()">Başka Bir Mesaj Çek 🎲</button>
    </div>

    <script>
        const mesajlar = [
            🌸 "Bugün aynaya bak ve o güzel gülüşünü saklama. Sen, bu dünyadaki en eşsiz detaylardan birisin. Yolun hep açık, kalbin hep ferah olsun."

🛣️ "Hayat bazen uzun ve yorucu bir yolculuk gibi gelebilir. Ama unutma, direksiyon senin ellerinde ve en güzel manzaralar henüz görmediklerin. Gittiğin her yol güzelliklere çıksın!"

✨ "Mutluluk devasa şeylerde değil, işte böyle direksiyon başındayken gözüne çarpan küçücük bir detayda gizlidir. Daima gülümsemek için bir neden bulman dileğiyle..."

💖 "Günün nasıl geçmiş olursa olsun, şu an bu mesajı okuyorsan derin bir nefes al. Her şey yoluna girecek. Sen güçlüsün ve her yeni kilometre, yeni bir umuttur."

🏡 "Gittiğin her yol seni sevdiklerine, huzura ve hayallerine sağ salim ulaştırsın. Aracındaki bu küçük detay, her baktığında sana ne kadar özel olduğunu hatırlatsın."

🎶 "Trafiğe, sese veya koşturmacaya değil; radyoda çalan o sevdiğin şarkıya ve anın güzelliğine odaklan. Sen her şeyin en güzelini hak ediyorsun."

🌟 "Yollar bazen karanlık veya sisli olabilir ama senin içindeki ışık her yeri aydınlatmaya yeter. Gittiğin her yere o güzel enerjini taşı."

🪄 "Aracına eklediğin bu minik süs, aslında kendine ve kendi alanına verdiğin değerin bir yansıması. Lütfen bugün kendine çok iyi bak, çünkü sen çok değerlisin."

💌 "Belki bugün kimse sana ne kadar harika biri olduğunu söylemedi. O yüzden biz söylemek istedik: İyi ki varsın, harika görünüyorsun!"

🍀 "Bizi yol arkadaşın olarak seçtiğin için teşekkür ederiz. Sadece aracını değil, gününü de biraz olsun aydınlatabildiysek ne mutlu bize. Emniyet kemerini tak ve hayatın tadını çıkar!"
        ];

        function yeniMesaj() {
            const random = Math.floor(Math.random() * mesajlar.length);
            document.getElementById("msg").innerText = mesajlar[random];
        }
        
        yeniMesaj(); // Sayfa açılınca çalıştır
    </script>
</body>
</html>
